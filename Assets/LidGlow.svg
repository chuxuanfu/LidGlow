  <rect x="352" y="458" width="320" height="28" rx="14" fill="#5CEAFF" filter="url(#glow)"/>
  <rect x="352" y="458" width="320" height="28" rx="14" fill="#83F1FF"/>
  <rect x="372" y="466" width="280" height="8" rx="4" fill="#B5FAFF"/>
</svg>